[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydepotdownloader"
dynamic = ["version"]
description = "Steam depot downloading utility - a Python port of SteamRE/DepotDownloader"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
keywords = ["steam", "depot", "steampipe", "cdn", "downloader", "workshop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "steam[client]>=1.4.4",
    "requests>=2.28",
    "qrcode>=7.4",
    # Some depots ship Zstd compressed chunks, and the standard library only has a zstd module
    # from 3.14 on, so on anything older this is not optional.
    "zstandard>=0.22; python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/enie7/pydepotdownloader"
Source = "https://github.com/enie7/pydepotdownloader"
Issues = "https://github.com/enie7/pydepotdownloader/issues"
Changelog = "https://github.com/enie7/pydepotdownloader/releases"

[project.optional-dependencies]
# Faster AES and zstd backends. The code falls back to pycryptodome and the standard library
# without them, but they are worth several times the chunk processing throughput.
speed = ["cryptography>=42", "zstandard>=0.22"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
depotdownloader = "pydepotdownloader.program:main"

[tool.setuptools]
packages = ["pydepotdownloader"]

[tool.setuptools.dynamic]
version = { attr = "pydepotdownloader.__version__" }

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # a handful of usage/help strings are deliberately long
]

[tool.pytest.ini_options]
testpaths = ["tests"]
